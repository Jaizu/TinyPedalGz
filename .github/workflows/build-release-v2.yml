name: Build Development Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      test_build:
        description: "Test build"
        default: false
        required: false
        type: boolean

run-name: TinyPedal dev build (${{ github.sha }})

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # Create linux release file
  linux:
    if: false
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.get_ver.outputs.release_tag }}
      short_sha: ${{ steps.get_ver.outputs.short_sha }}
      sha256: ${{ steps.get_hash.outputs.hash_output }}

    steps:
    - name: Checkout master and submodules
      uses: actions/checkout@v7
      with:
        submodules: "true"

    - name: Fetch version number
      id: get_ver
      run: |
        short_sha="${GITHUB_SHA:0:12}"
        echo "short_sha=${short_sha}" >> $GITHUB_OUTPUT
        echo "release_tag=dev" >> $GITHUB_OUTPUT
        echo "Development build for commit: ${GITHUB_SHA}"

    - name: ZIP Linux file
      run: |
        file_name=TinyPedal-dev-${{ steps.get_ver.outputs.short_sha }}-linux.zip
        zip -r $file_name . -x *.git/* -x *.github/*

    - name: Check hash sum
      id: get_hash
      run: |
        sha256hash=$(sha256sum TinyPedal-dev-${{ steps.get_ver.outputs.short_sha }}-linux.zip | awk '{print $1}')
        echo "hash_output=${sha256hash}" >> $GITHUB_OUTPUT
        echo $sha256hash

    - name: Upload release files
      uses: softprops/action-gh-release@v3
      if: ${{ !inputs.test_build }}
      with:
        name: TinyPedal dev ${{ steps.get_ver.outputs.short_sha }}
        prerelease: true
        make_latest: false
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ steps.get_ver.outputs.release_tag }}
        files: |
          TinyPedal-dev-${{ steps.get_ver.outputs.short_sha }}-linux.zip

  # Create windows release file
  windows:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.get_ver.outputs.release_tag }}
      short_sha: ${{ steps.get_ver.outputs.short_sha }}
      sha256: ${{ steps.get_hash.outputs.hash_output }}

    steps:
    - name: Checkout master and submodules
      uses: actions/checkout@v7
      with:
        submodules: "true"

    - name: Fetch release metadata
      id: get_ver
      run: |
        short_sha="${GITHUB_SHA:0:12}"
        echo "short_sha=${short_sha}" >> $GITHUB_OUTPUT
        echo "release_tag=dev" >> $GITHUB_OUTPUT

    - name: Set up Python 3.8 environment for Windows build
      uses: actions/setup-python@v7
      with:
        python-version: "3.8"
        architecture: "x64"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install py2exe

    - name: Build Windows executable
      run: |
        python freeze_py2exe.py -c

    - name: ZIP Windows file
      shell: pwsh
      run: |
        $file_name="TinyPedal-dev-${{ steps.get_ver.outputs.short_sha }}-windows.zip"
        Compress-Archive -Path ./dist/TinyPedal -DestinationPath ./$file_name

    - name: Check hash sum
      id: get_hash
      run: |
        sha256hash=$(sha256sum TinyPedal-dev-${{ steps.get_ver.outputs.short_sha }}-windows.zip | awk '{print $1}')
        echo "hash_output=${sha256hash}" >> $GITHUB_OUTPUT
        echo $sha256hash

    - name: Upload release files
      uses: softprops/action-gh-release@v3
      if: ${{ !inputs.test_build }}
      with:
        name: TinyPedal dev ${{ steps.get_ver.outputs.short_sha }}
        prerelease: true
        make_latest: false
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ steps.get_ver.outputs.release_tag }}
        files: |
          TinyPedal-dev-${{ steps.get_ver.outputs.short_sha }}-windows.zip

  # Generate release notes
  release-notes:
    runs-on: ubuntu-latest
    needs: windows

    steps:
    - name: Checkout master and submodules
      uses: actions/checkout@v7

    - name: Get latest change log
      run: |
        echo "Development build for commit ${GITHUB_SHA}" > release.txt
        echo >> release.txt
        prev_line_num=$(grep -n "^\----*$" "./docs/changelog.txt" | sed -n "2,2p" | sed 's/[\:\-]//g')
        sed -n "1,$(expr $prev_line_num - 2)p" "./docs/changelog.txt" >> release.txt
        echo "Hash sum" >> release.txt
        echo "---" >> release.txt
        echo "Windows SHA256: ${{ needs.windows.outputs.sha256 }}" >> release.txt
        cat release.txt

    - name: Update release notes
      uses: softprops/action-gh-release@v3
      if: ${{ !inputs.test_build }}
      with:
        name: TinyPedal dev ${{ needs.windows.outputs.short_sha }}
        prerelease: true
        make_latest: false
        body_path: release.txt
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ needs.windows.outputs.release_tag }}

concurrency:
  group: TinyPedal-dev-${{ github.sha }}
  cancel-in-progress: false
